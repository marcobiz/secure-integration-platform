openapi: 3.1.0
info:
  title: Secure Integration Platform Gateway API
  version: 1.0.0
  description: Runtime, enrollment and minimum administrative contract.
servers:
  - url: https://gateway.example.invalid
tags:
  - name: Runtime
  - name: Enrollment
  - name: Admin
  - name: Health
paths:
  /v1/connectors/{connectorId}/operations/{operationId}:invoke:
    post:
      tags: [Runtime]
      operationId: invokeConnectorOperation
      security:
        - InstallationMutualTLS: []
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ContentHash'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/TraceParent'
      requestBody:
        required: true
        content:
          application/vnd.broker-gateway.invoke+json:
            schema:
              $ref: '#/components/schemas/InvokeRequest'
          multipart/related:
            schema:
              type: string
              contentMediaType: multipart/related
      responses:
        '200':
          description: Operation completed.
          content:
            application/vnd.broker-gateway.result+json:
              schema:
                $ref: '#/components/schemas/InvokeResponse'
        '202':
          description: An invocation with the same idempotency key is in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationStatus'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }
  /v1/enrollments/challenges:
    post:
      tags: [Enrollment]
      operationId: createEnrollmentChallenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentChallengeRequest'
      responses:
        '200':
          description: Short-lived challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentChallengeResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/enrollments:activate:
    post:
      tags: [Enrollment]
      operationId: activateInstallation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
      responses:
        '200':
          description: Installation enrolled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResult'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/enrollments:renew:
    post:
      tags: [Enrollment]
      operationId: renewInstallationCredential
      security:
        - InstallationMutualTLS: []
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/ContentHash'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewalRequest'
      responses:
        '200':
          description: New credential registered with overlap period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResult'
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/broker-policy:
    get:
      tags: [Runtime]
      operationId: getBrokerPolicy
      security:
        - InstallationMutualTLS: []
      responses:
        '200':
          description: Compatibility and renewal policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerPolicy'
        '403': { $ref: '#/components/responses/Problem' }
  /admin/v1/installations/{installationId}:revoke:
    post:
      tags: [Admin]
      operationId: revokeInstallation
      security:
        - AdminOidc: [security_admin]
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '204': { description: Revoked. }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors/{connectorId}/versions:
    post:
      tags: [Admin]
      operationId: createConnectorVersion
      security:
        - AdminOidc: [connector_editor]
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [configuration]
              properties:
                configuration: { type: object }
                releaseNotes: { type: string, maxLength: 4000 }
      responses:
        '201':
          description: Draft version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorVersionResource'
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors/{connectorId}/versions/{versionId}:validate:
    post:
      tags: [Admin]
      operationId: validateConnectorVersion
      security:
        - AdminOidc: [connector_editor]
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400': { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors/{connectorId}/versions/{versionId}:approve:
    post:
      tags: [Admin]
      operationId: approveConnectorVersion
      security:
        - AdminOidc: [connector_approver]
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '204': { description: Approved by a distinct actor. }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors/{connectorId}/versions/{versionId}:publish:
    post:
      tags: [Admin]
      operationId: publishConnectorVersion
      security:
        - AdminOidc: [connector_approver]
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [environmentId]
              properties:
                environmentId: { type: string, format: uuid }
      responses:
        '204': { description: Published and deployed atomically. }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors/{connectorId}:rollback:
    post:
      tags: [Admin]
      operationId: rollbackConnector
      security:
        - AdminOidc: [connector_approver]
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [environmentId, targetVersionId, reason]
              properties:
                environmentId: { type: string, format: uuid }
                targetVersionId: { type: string, format: uuid }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '204': { description: New deployment revision points to the previous version. }
        '409': { $ref: '#/components/responses/Problem' }
  /health/live:
    get:
      tags: [Health]
      operationId: liveness
      security: []
      responses:
        '200': { description: Process is alive. }
  /health/ready:
    get:
      tags: [Health]
      operationId: readiness
      security: []
      responses:
        '200': { description: Required dependencies are ready. }
        '503': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    InstallationMutualTLS:
      type: mutualTLS
      description: Per-Installation client certificate plus signed request headers.
    AdminOidc:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration
  parameters:
    ConnectorId:
      name: connectorId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9.-]{2,99}$' }
    OperationId:
      name: operationId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9.-]{2,99}$' }
    InstallationId:
      name: installationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Timestamp:
      name: X-BG-Timestamp
      in: header
      required: true
      schema: { type: string, format: date-time }
    Nonce:
      name: X-BG-Nonce
      in: header
      required: true
      schema: { type: string, minLength: 22, maxLength: 128 }
    ContentHash:
      name: X-BG-Content-SHA256
      in: header
      required: true
      schema: { type: string, minLength: 43, maxLength: 64 }
    Signature:
      name: X-BG-Signature
      in: header
      required: true
      schema: { type: string, minLength: 80, maxLength: 256 }
    TraceParent:
      name: traceparent
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    InvokeRequest:
      type: object
      additionalProperties: false
      required: [protocolVersion, payload, correlationId]
      properties:
        protocolVersion: { const: '1.0' }
        payload: { $ref: '#/components/schemas/Payload' }
        operatorContext: { $ref: '#/components/schemas/OperatorContext' }
        sessionRef: { type: [string, 'null'], maxLength: 256 }
        metadata:
          type: object
          maxProperties: 32
          additionalProperties:
            type: [string, number, integer, boolean, 'null']
        correlationId: { type: string, format: uuid }
        idempotencyKey: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        extensions: { type: object, maxProperties: 16 }
    Payload:
      type: object
      additionalProperties: false
      required: [contentType, encoding, data]
      properties:
        contentType: { type: string, maxLength: 128 }
        encoding: { enum: [utf8, base64] }
        data: { type: string, maxLength: 22369624 }
    OperatorContext:
      type: [object, 'null']
      additionalProperties: false
      properties:
        subject: { type: string, maxLength: 256 }
        attributes:
          type: object
          maxProperties: 16
          additionalProperties: { type: string, maxLength: 512 }
    InvokeResponse:
      type: object
      additionalProperties: false
      required: [correlationId, connectorVersion, result]
      properties:
        correlationId: { type: string, format: uuid }
        connectorVersion: { type: string }
        result: { $ref: '#/components/schemas/Payload' }
        sessionRef: { type: [string, 'null'], maxLength: 256 }
        extensions: { type: object }
    InvocationStatus:
      type: object
      additionalProperties: false
      required: [correlationId, status]
      properties:
        correlationId: { type: string, format: uuid }
        status: { enum: [inProgress, completed, failed] }
    EnrollmentChallengeRequest:
      type: object
      additionalProperties: false
      required: [activationCodeId, publicKeySpki]
      properties:
        activationCodeId: { type: string, format: uuid }
        publicKeySpki: { type: string, contentEncoding: base64 }
    EnrollmentChallengeResponse:
      type: object
      additionalProperties: false
      required: [challengeId, challenge, expiresAt]
      properties:
        challengeId: { type: string, format: uuid }
        challenge: { type: string, contentEncoding: base64url }
        expiresAt: { type: string, format: date-time }
    ActivationRequest:
      type: object
      additionalProperties: false
      required: [challengeId, activationCode, clientCertificate, proofSignature, brokerVersion]
      properties:
        challengeId: { type: string, format: uuid }
        activationCode: { type: string, minLength: 22, maxLength: 256 }
        clientCertificate: { type: string, contentEncoding: base64 }
        proofSignature: { type: string, contentEncoding: base64url }
        brokerVersion: { type: string, maxLength: 64 }
    RenewalRequest:
      type: object
      additionalProperties: false
      required: [newClientCertificate, proofSignature]
      properties:
        newClientCertificate: { type: string, contentEncoding: base64 }
        proofSignature: { type: string, contentEncoding: base64url }
    EnrollmentResult:
      type: object
      additionalProperties: false
      required: [installationId, tenantId, applicationId, credentialExpiresAt]
      properties:
        installationId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        credentialExpiresAt: { type: string, format: date-time }
        renewalStartsAt: { type: string, format: date-time }
    BrokerPolicy:
      type: object
      additionalProperties: false
      required: [minimumBrokerVersion, protocolMajor, protocolMinor]
      properties:
        minimumBrokerVersion: { type: string }
        protocolMajor: { type: integer, minimum: 1 }
        protocolMinor: { type: integer, minimum: 0 }
        revoked: { type: boolean, default: false }
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }
    ConnectorVersionResource:
      type: object
      additionalProperties: false
      required: [id, connectorId, state, checksum]
      properties:
        id: { type: string, format: uuid }
        connectorId: { type: string }
        state: { enum: [Draft, Validated, Approved, Published, Superseded, Retired] }
        checksum: { type: string }
    ValidationResult:
      type: object
      additionalProperties: false
      required: [valid, issues]
      properties:
        valid: { type: boolean }
        issues:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [path, code]
            properties:
              path: { type: string }
              code: { type: string }
              message: { type: string }
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId, retryable]
      properties:
        type: { type: string, format: uri }
        title: { type: string, maxLength: 256 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, maxLength: 2000 }
        instance: { type: string }
        code: { type: string, pattern: '^BGW-[A-Z0-9-]+$' }
        correlationId: { type: string, format: uuid }
        retryable: { type: boolean }
        retryAfterMs: { type: integer, minimum: 0, maximum: 3600000 }
        details:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [field, reason]
            properties:
              field: { type: string, maxLength: 256 }
              reason: { type: string, maxLength: 128 }

