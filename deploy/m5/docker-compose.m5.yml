services:
  provisioner:
    environment:
      M5_POSTGRES_ADMIN_API_PASSWORD: ${M5_POSTGRES_ADMIN_API_PASSWORD:?required}
  gateway:
    ports:
      - "127.0.0.1:${M5_GATEWAY_PORT:-18443}:8443"
    environment:
      ASPNETCORE_ENVIRONMENT: M5Testing
      Gateway__Admin__Mode: DevelopmentAuth
      Gateway__Admin__RequireFourEyes: "true"
      ConnectionStrings__GatewayAdminDatabase: Host=postgres;Port=5432;Database=broker_gateway_m3;Username=m5_gateway_admin;Password=${M5_POSTGRES_ADMIN_API_PASSWORD:?required};SSL Mode=Disable;GSS Encryption Mode=Disable
