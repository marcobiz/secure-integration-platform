services:
  gateway:
    user: ${FSE2_CONTAINER_RUNTIME_UID:-1654}
    build:
      context: ../..
      dockerfile: packs/deployment/local-pkcs12/Dockerfile
    environment:
      Gateway__Provider__Kind: ExternalPack
      Gateway__Provider__Endpoint: https://fse2-lab/
      Gateway__Provider__AssemblyPath: /app/packs/local-pkcs12/SecureIntegration.Providers.LocalPkcs12.dll
      Gateway__Provider__FactoryType: SecureIntegration.Providers.LocalPkcs12.LocalPkcs12ProviderPackFactory
      Gateway__Provider__Settings__ManifestPath: /run/fse2-provider/manifest.json
      Gateway__Provider__Settings__MaterialRootPath: /run/fse2-provider/material
      Gateway__Provider__Resources__0__ProviderId: local-pkcs12
      Gateway__Provider__Resources__0__ProviderDisplayName: Local PKCS12
      Gateway__Provider__Resources__0__ProviderType: local-pkcs12
      Gateway__Provider__Resources__0__ResourceId: fse2-auth
      Gateway__Provider__Resources__0__ResourceType: ClientCertificate
      Gateway__Provider__Resources__0__DisplayName: FSE2 test mTLS identity
      Gateway__Provider__Resources__0__EnvironmentId: ${FSE2_TEST_ENVIRONMENT_ID:?required}
      Gateway__Provider__Resources__0__ConnectorScope: ${FSE2_CONNECTOR_SCOPE:-fse2-national}
      Gateway__Provider__Resources__0__OperationScope: '*'
      Gateway__Provider__Resources__0__ProviderReference: local-pkcs12://fse2-lab/fse2-auth
      Gateway__Provider__Resources__0__Version: ${FSE2_AUTH_CERT_VERSION:?required}
      Gateway__Provider__Resources__0__PublicMetadataRevision: '1'
      Gateway__Provider__Resources__1__ProviderId: local-pkcs12
      Gateway__Provider__Resources__1__ProviderDisplayName: Local PKCS12
      Gateway__Provider__Resources__1__ProviderType: local-pkcs12
      Gateway__Provider__Resources__1__ResourceId: fse2-sign
      Gateway__Provider__Resources__1__ResourceType: ClientCertificate
      Gateway__Provider__Resources__1__DisplayName: FSE2 test JWT signing identity
      Gateway__Provider__Resources__1__EnvironmentId: ${FSE2_TEST_ENVIRONMENT_ID:?required}
      Gateway__Provider__Resources__1__ConnectorScope: ${FSE2_CONNECTOR_SCOPE:-fse2-national}
      Gateway__Provider__Resources__1__OperationScope: '*'
      Gateway__Provider__Resources__1__ProviderReference: local-pkcs12://fse2-lab/fse2-sign
      Gateway__Provider__Resources__1__Version: ${FSE2_SIGN_CERT_VERSION:?required}
      Gateway__Provider__Resources__1__PublicMetadataRevision: '1'
      Gateway__ExecutionModules__0__ModuleId: healthcare-fse2
      Gateway__ExecutionModules__0__AssemblyPath: /app/packs/healthcare-fse2/SecureIntegration.ConnectorPacks.Healthcare.FSE2.dll
      Gateway__ExecutionModules__0__AssemblyFullName: SecureIntegration.ConnectorPacks.Healthcare.FSE2, Version=1.0.0.0, Culture=neutral, PublicKeyToken=null
      Gateway__ExecutionModules__0__ModuleType: SecureIntegration.ConnectorPacks.Healthcare.FSE2.Fse2OrganizationExecutionModule
    volumes:
      - type: bind
        source: ${FSE2_PROVIDER_MANIFEST_PATH:?required}
        target: /run/fse2-provider/manifest.json
        read_only: true
      - type: bind
        source: ${FSE2_PROVIDER_MATERIAL_DIRECTORY:?required}
        target: /run/fse2-provider/material
        read_only: true
