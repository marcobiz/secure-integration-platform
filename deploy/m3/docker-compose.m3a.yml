name: broker-gateway-m3a

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: broker_gateway_m3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${M3_POSTGRES_ADMIN_PASSWORD:?required}
    networks:
      m3:
        ipv4_address: 172.29.44.3
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d broker_gateway_m3"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - m3-postgres:/var/lib/postgresql

  migrations:
    build:
      context: ../..
      dockerfile: src/Gateway/Gateway.Migrations/Dockerfile
    environment:
      GATEWAY_MIGRATION_CONNECTION: Host=postgres;Port=5432;Database=broker_gateway_m3;Username=postgres;Password=${M3_POSTGRES_ADMIN_PASSWORD:?required};SSL Mode=Disable;GSS Encryption Mode=Disable
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    networks: [m3]

  provisioner:
    build:
      context: ../..
      dockerfile: tools/m3/Provisioner/Dockerfile
    environment:
      M3_POSTGRES_ADMIN_CONNECTION: Host=postgres;Port=5432;Database=broker_gateway_m3;Username=postgres;Password=${M3_POSTGRES_ADMIN_PASSWORD:?required};SSL Mode=Disable;GSS Encryption Mode=Disable
      M3_POSTGRES_RUNTIME_PASSWORD: ${M3_POSTGRES_RUNTIME_PASSWORD:?required}
      M3_ACTIVATION_HMAC_BASE64: ${M3_ACTIVATION_HMAC_BASE64:?required}
      M3_PROVISIONING_OUTPUT: /evidence-raw/provisioning.json
    volumes:
      - ${M3_RAW_EVIDENCE_DIRECTORY:?required}:/evidence-raw
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks: [m3]

  vault:
    build:
      context: ../..
      dockerfile: tools/m3/SyntheticVault/Dockerfile
    hostname: vault.m3.test
    environment:
      ASPNETCORE_URLS: https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /run/m3-certs/vault.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${M3_CERTIFICATE_PASSWORD:?required}
      M3_SYNTHETIC_VAULT_TOKEN: ${M3_SYNTHETIC_VAULT_TOKEN:?required}
      M3_VENDOR_API_KEY: ${M3_VENDOR_API_KEY:?required}
      M3_VENDOR_CLIENT_PFX_BASE64: ${M3_VENDOR_CLIENT_PFX_BASE64:?required}
      M3_WRONG_VENDOR_CLIENT_PFX_BASE64: ${M3_WRONG_VENDOR_CLIENT_PFX_BASE64:?required}
      M3_ACTIVATION_HMAC_BASE64: ${M3_ACTIVATION_HMAC_BASE64:?required}
    volumes:
      - ${M3_CERTIFICATE_DIRECTORY:?required}:/run/m3-certs:ro
    read_only: true
    tmpfs: [/tmp]
    networks:
      m3:
        ipv4_address: 172.29.44.5
        aliases:
          - vault.m3.test
    ports:
      - "18444:8443"

  vendor:
    build:
      context: ../..
      dockerfile: tools/m3/VendorMock/Dockerfile
    hostname: vendor.m3.test
    environment:
      ASPNETCORE_URLS: https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /run/m3-certs/vendor-server.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${M3_CERTIFICATE_PASSWORD:?required}
      M3_VENDOR_API_KEY: ${M3_VENDOR_API_KEY:?required}
      M3_VENDOR_CLIENT_THUMBPRINT: ${M3_VENDOR_CLIENT_THUMBPRINT:?required}
      M3_VENDOR_CONTROL_TOKEN: ${M3_VENDOR_CONTROL_TOKEN:?required}
    volumes:
      - ${M3_CERTIFICATE_DIRECTORY:?required}:/run/m3-certs:ro
    read_only: true
    tmpfs: [/tmp]
    networks:
      m3:
        ipv4_address: 172.29.44.6
        aliases:
          - vendor.m3.test
    ports:
      - "18445:8443"

  gateway:
    build:
      context: ../..
      dockerfile: src/Gateway/Gateway.Api/Dockerfile
    ports:
      - "18443:8443"
    environment:
      ASPNETCORE_ENVIRONMENT: M3Testing
      ASPNETCORE_URLS: https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /run/m3-certs/gateway.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${M3_CERTIFICATE_PASSWORD:?required}
      GATEWAY_HEALTH_URL: https://localhost:8443/health/live
      SSL_CERT_FILE: /run/m3-certs/ca.crt
      ConnectionStrings__GatewayDatabase: Host=postgres;Port=5432;Database=broker_gateway_m3;Username=m3_gateway_runtime;Password=${M3_POSTGRES_RUNTIME_PASSWORD:?required};SSL Mode=Disable;GSS Encryption Mode=Disable
      Gateway__SyntheticVaultUri: https://vault.m3.test:8443/
      Gateway__SyntheticVaultTokenEnvironmentVariable: M3_SYNTHETIC_VAULT_TOKEN
      M3_SYNTHETIC_VAULT_TOKEN: ${M3_SYNTHETIC_VAULT_TOKEN:?required}
      Gateway__ActivationHmacKeyBase64: ${M3_ACTIVATION_HMAC_BASE64:?required}
      Gateway__M3PrivateMockHost: vendor.m3.test
      Gateway__M3PrivateMockCidr: 172.29.44.0/28
      Gateway__Operations__0__ConnectorId: m3-vendor
      Gateway__Operations__0__OperationId: submit
      Gateway__Operations__0__Version: 3.0.0-m3
      Gateway__Operations__0__Endpoint: https://vendor.m3.test:8443/vendor/orders
      Gateway__Operations__0__Method: POST
      Gateway__Operations__0__RequestContentType: application/json
      Gateway__Operations__0__Authentication: ApiKeyAndMutualTls
      Gateway__Operations__0__ApiKeySecretReference: synthetic-vault://vault.m3.test/vendor-api-key
      Gateway__Operations__0__ApiKeyHeaderName: X-Vendor-Api-Key
      Gateway__Operations__0__ClientCertificateReference: synthetic-vault://vault.m3.test/vendor-client-certificate
      Gateway__Operations__0__MaximumRequestBytes: 1048576
      Gateway__Operations__0__MaximumResponseBytes: 1048576
      Gateway__Operations__1__ConnectorId: m3-vendor
      Gateway__Operations__1__OperationId: loopback
      Gateway__Operations__1__Version: 3.0.0-m3
      Gateway__Operations__1__Endpoint: https://127.0.0.1/vendor/orders
      Gateway__Operations__1__Authentication: None
      Gateway__Operations__2__ConnectorId: m3-vendor
      Gateway__Operations__2__OperationId: private
      Gateway__Operations__2__Version: 3.0.0-m3
      Gateway__Operations__2__Endpoint: https://172.29.44.7/vendor/orders
      Gateway__Operations__2__Authentication: None
      Gateway__Operations__3__ConnectorId: m3-vendor
      Gateway__Operations__3__OperationId: metadata
      Gateway__Operations__3__Version: 3.0.0-m3
      Gateway__Operations__3__Endpoint: https://169.254.169.254/latest/meta-data/
      Gateway__Operations__3__Authentication: None
      Gateway__Operations__4__ConnectorId: m3-vendor
      Gateway__Operations__4__OperationId: redirect
      Gateway__Operations__4__Version: 3.0.0-m3
      Gateway__Operations__4__Endpoint: https://vendor.m3.test:8443/vendor/redirect
      Gateway__Operations__4__Authentication: ApiKeyAndMutualTls
      Gateway__Operations__4__ApiKeySecretReference: synthetic-vault://vault.m3.test/vendor-api-key
      Gateway__Operations__4__ApiKeyHeaderName: X-Vendor-Api-Key
      Gateway__Operations__4__ClientCertificateReference: synthetic-vault://vault.m3.test/vendor-client-certificate
      Gateway__Operations__5__ConnectorId: m3-vendor
      Gateway__Operations__5__OperationId: wrong-certificate
      Gateway__Operations__5__Version: 3.0.0-m3
      Gateway__Operations__5__Endpoint: https://vendor.m3.test:8443/vendor/orders
      Gateway__Operations__5__Authentication: ApiKeyAndMutualTls
      Gateway__Operations__5__ApiKeySecretReference: synthetic-vault://vault.m3.test/vendor-api-key
      Gateway__Operations__5__ApiKeyHeaderName: X-Vendor-Api-Key
      Gateway__Operations__5__ClientCertificateReference: synthetic-vault://vault.m3.test/vendor-wrong-client-certificate
    volumes:
      - ${M3_CERTIFICATE_DIRECTORY:?required}:/run/m3-certs:ro
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      provisioner:
        condition: service_completed_successfully
      vault:
        condition: service_started
      vendor:
        condition: service_started
    networks:
      m3:
        ipv4_address: 172.29.44.4

networks:
  m3:
    ipam:
      config:
        - subnet: 172.29.44.0/28

volumes:
  m3-postgres:
